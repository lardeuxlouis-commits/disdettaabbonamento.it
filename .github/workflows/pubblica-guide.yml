# Publication automatique des guides programmés (champ pubblica_dal dans _build/guide.py).
# Chaque matin : si un guide doit sortir aujourd'hui, on reconstruit le site, on pousse docs/
# (GitHub Pages republie) et on prévient Bing/Yandex via IndexNow. Les autres jours, rien ne change.
name: Pubblica guide programmate

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC, soit 6h15 à Paris en hiver
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Un guide sort-il aujourd'hui ?
        id: check
        run: |
          cd _build
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          from guide import GUIDE
          oggi = datetime.date.today().isoformat()
          slugs = [g.get("slug", "?") for g in GUIDE if g.get("pubblica_dal") == oggi]
          print("oggi=" + ("1" if slugs else "0"))
          print("slugs=" + " ".join(slugs))
          PY

      - uses: actions/setup-python@v5
        if: steps.check.outputs.oggi == '1'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.check.outputs.oggi == '1'
        run: |
          pip install "python-docx==1.2.0" "lxml==6.1.3"
          cd _build && python build.py

      - name: Commit et push
        if: steps.check.outputs.oggi == '1'
        run: |
          git config user.name "pubblicazione-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add docs _build/urls.txt
          git commit -m "auto: publication des guides du jour (${{ steps.check.outputs.slugs }})" || exit 0
          git push

      - name: IndexNow
        if: steps.check.outputs.oggi == '1'
        run: |
          python3 - <<'PY'
          import json, urllib.request
          k = open("_build/indexnow.key").read().strip()
          slugs = "${{ steps.check.outputs.slugs }}".split()
          urls = ["https://disdettaabbonamento.it/guide/%s/" % s for s in slugs] + ["https://disdettaabbonamento.it/guide/"]
          body = json.dumps({"host": "disdettaabbonamento.it", "key": k,
                             "keyLocation": "https://disdettaabbonamento.it/%s.txt" % k, "urlList": urls}).encode()
          for ep in ("https://api.indexnow.org/indexnow", "https://www.bing.com/indexnow"):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json"}), timeout=30)
                  print(ep, r.status)
              except Exception as e:
                  print(ep, e)
          PY
